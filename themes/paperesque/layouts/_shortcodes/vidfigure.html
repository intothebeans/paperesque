<figure {{ with .Get "class" }} class="{{ . }}" {{ end }}>
    {{- if .Get "link" -}}
        <a href="{{ .Get "link" }}"{{ with .Get "target" }} target="{{ . }}"{{ end }}{{ with .Get "rel" }} rel="{{ . }}"{{ end }}>
    {{- end }}
    <video controls playsinline src='{{ .Get "src" }}'
        {{- if or (.Get "alt") (.Get "caption") }}
            alt="{{ with .Get "alt" }}{{ . }}{{ else }}{{ .Get "caption" | markdownify| plainify }}{{ end }}"
        {{- end -}}
        {{- with .Get "width" }}
          width="{{ . }}"
        {{ end -}}
        {{- with .Get "height" }}
          height="{{ . }}"
        {{ end -}}>
    {{- if .Get "captions"}}
      <track kind="captions" src='{{ .Get "captions" }}' {{ with .Get "capsrclang" }}srclang="{{ . }}"{{ else }}srclang="en"{{ end }} {{ with .Get "caplabel" }}label="{{ . }}"{{ else }}label="English"{{ end }} default>
    {{end -}}

  </video>
    {{- if .Get "link" }}</a>{{ end -}}
    {{- if or (or (.Get "title") (.Get "caption")) (.Get "attr") }}
        <figcaption>
            {{ with (.Get "title") -}}
                <h4>{{ . }}</h4>
            {{- end -}}
            {{- if or (.Get "caption") (.Get "attr") -}}<p>
                {{- .Get "caption" | markdownify -}}
                {{- with .Get "attrlink" }}
                    <a href="{{ .Get "attrlink" }}"{{ with .Get "attrtarget" }} target="{{ . }}"{{ end }}{{ with .Get "attrrel" }} rel="{{ . }}"{{ end }}>
                {{- end -}}
                {{- .Get "attr" | markdownify -}}
                {{- if .Get "attrlink" }}</a>{{ end }}</p>
            {{- end }}
        </figcaption>
    {{- end }}
</figure>
