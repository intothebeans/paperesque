{{ $id := .Get "id" | default "score" }}
{{ $enablePlayback := .Get "audio" | default false }}
{{ $includeDownload := .Get "download" | default false }}
{{ $abcOptions := .Get "abcoptions" | default "null" }}


<div class="music-container" label="an ABCjs rendered music score">
    <div id="{{ $id }}" class="music"></div>
    {{ if $enablePlayback }}
        <div class="audio-controls">
            <div id="audio" class="audio"></div>
        <script type="text/javascript">
            window.addEventListener("DOMContentLoaded", function() {
                window.musicWithPlayback(
                "{{ $id }}",
                `{{ .Inner | safeJS }}`,
                {{ $abcOptions | safeJS }}
                )});
        </script> {{ if $includeDownload }}
                <div class="midi">MIDI</div>
            {{ end }}
        </div>
    {{ else }}
        <script type="text/javascript">
          window.addEventListener("DOMContentLoaded", function() {
            window.drawMusic("{{ $id }}", `{{ .Inner | safeJS }}`, {{ $abcOptions | safeJS }});
          });
        </script>
    {{ end }}
</div>
